<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Muhammad Hussnain Akram</title>
    <meta name="description" content="Get in touch with Muhammad Hussnain Akram. Contact via email, phone, or view GitHub and LinkedIn profiles.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Gradient Glows & Doodles -->
    <div class="bg-glow"></div>
    <div class="bg-doodles">
        <div class="doodle doodle-grid"></div>
        <div class="doodle doodle-dots"></div>
        <div class="doodle doodle-circle-1"></div>
        <div class="doodle doodle-circle-2"></div>
        <div class="doodle doodle-bracket-1">&lt;/&gt;</div>
        <div class="doodle doodle-bracket-2">{ }</div>
    </div>

    <!-- Header Navigation Bar -->
    <header class="navbar"></header>

    <!-- Main Container -->
    <main class="container">
        <div class="contact-wrapper">
            <!-- Left Info Panel -->
            <div class="contact-info-panel animate-fade-in">
                <span class="section-subtitle">Get In Touch</span>
                <h1 class="contact-info-desc">Let's build something amazing together. Feel free to reach out!</h1>
                
                <div class="contact-details">
                    <!-- Address location -->
                    <div class="contact-detail-item">
                        <div class="contact-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        </div>
                        <div class="contact-detail-content">
                            <h4>Location</h4>
                            <p class="dyn-location">Lahore, Pakistan</p>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="contact-detail-item">
                        <div class="contact-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </div>
                        <div class="contact-detail-content">
                            <h4>Email</h4>
                            <p><a href="mailto:m.hussnainakram@gmail.com" class="dyn-email">m.hussnainakram@gmail.com</a></p>
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div class="contact-detail-item">
                        <div class="contact-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        </div>
                        <div class="contact-detail-content">
                            <h4>Phone</h4>
                            <p><a href="tel:+923154743800" class="dyn-phone">+92 315 474 3800</a></p>
                        </div>
                    </div>
                </div>

                <!-- Social Handles row -->
                <div>
                    <h4 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 1rem;">Social Media</h4>
                    <div class="contact-social-row">
                        <!-- Linkedin Icon -->
                        <a href="https://www.linkedin.com/in/muhammad-hussnain-akram-960556330" class="contact-social-btn dyn-linkedin-link" target="_blank" aria-label="LinkedIn">
                            <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                        </a>
                        <!-- Github Icon -->
                        <a href="https://github.com/hussnain-rjp" class="contact-social-btn dyn-github-link" target="_blank" aria-label="GitHub">
                            <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Right Contact Form Card -->
            <div class="glass-card animate-fade-in" style="animation-delay: 0.2s;">
                <form id="contact-form" novalidate>
                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" class="form-control" placeholder="Hi Hussnain, I'd like to collaborate on..." required></textarea>
                    </div>

                    <button type="submit" class="btn" style="width: 100%; justify-content: center; background: #25d366; color: #ffffff; border: none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);">
                        <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px; height:16px; margin-right:6px;"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.504-5.711-1.463L0 24zm6.22-3.882c1.644.976 3.254 1.488 4.936 1.49 5.485.002 9.947-4.453 9.95-9.932.001-2.654-1.026-5.148-2.894-7.018C16.442 2.788 13.953 1.76 11.3 1.761 5.813 1.761 1.35 6.223 1.347 11.702c-.001 1.776.47 3.498 1.365 5.05L1.76 21.053l4.517-1.195zM17.587 14.7c-.29-.145-1.72-.85-1.985-.947-.267-.097-.46-.145-.655.145-.194.29-.755.947-.925 1.14-.17.194-.34.218-.63.073-.29-.145-1.229-.453-2.34-1.445-.866-.774-1.452-1.73-1.622-2.02-.17-.29-.018-.448.127-.59.13-.13.29-.34.436-.51.145-.17.194-.29.291-.485.097-.194.048-.364-.024-.51-.071-.145-.655-1.579-.896-2.16-.236-.57-.494-.49-.656-.499-.17-.008-.364-.01-.56-.01-.194 0-.51.073-.777.364-.266.29-1.02 1.002-1.02 2.441 0 1.44 1.045 2.827 1.19 3.02.145.194 2.055 3.14 4.977 4.4 1.32.57 2.057.6 2.8.49.83-.12 1.72-.7 1.96-1.35.242-.65.242-1.21.17-1.35-.072-.14-.291-.22-.582-.365z"/></svg>
                        Send via WhatsApp
                    </button>

                    <div id="contact-form-status" class="form-status"></div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Area -->
    <footer class="footer"></footer>

    <!-- Core Scripts -->
    <script src="js/main.js"></script>
    <script>
        // Form validations and WhatsApp sending action
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("contact-form");
            const status = document.getElementById("contact-form-status");

            if (form && status) {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    
                    const name = document.getElementById("name").value.trim();
                    const email = document.getElementById("email").value.trim();
                    const message = document.getElementById("message").value.trim();

                    if (!name || !email || !message) {
                        status.innerText = "Please fill in all fields.";
                        status.className = "form-status error";
                        return;
                    }

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        status.innerText = "Please enter a valid email address.";
                        status.className = "form-status error";
                        return;
                    }

                    status.innerText = "Redirecting you to WhatsApp...";
                    status.className = "form-status success";

                    const waText = `Hi Hussnain, my name is ${name}.\nEmail: ${email}\nMessage: ${message}`;
                    const waUrl = `https://wa.me/923154743800?text=${encodeURIComponent(waText)}`;
                    
                    setTimeout(() => {
                        window.open(waUrl, "_blank");
                        form.reset();
                        status.style.display = "none";
                    }, 500);
                });
            }
        });
    </script>
</body>
</html>
